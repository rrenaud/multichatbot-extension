[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "askall"
version = "0.1.0"
description = "Ask your logged-in ChatGPT/Gemini/Claude browser tabs from the CLI (via the MultiChatbot extension bridge)"
requires-python = ">=3.9"
dependencies = ["websockets>=13"]

[project.scripts]
askall = "askall:main"

[tool.setuptools]
py-modules = ["askall"]
